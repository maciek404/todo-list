<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Task</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen font-sans">
    <div class="max-w-6xl mx-auto px-4 py-8">
        <header class="mb-8 pb-4 border-b border-slate-200 flex items-center justify-between">
            <div>
                <h1 class="font-heading text-4xl font-bold tracking-tight">Edit Task</h1>
                <p class="text-slate-500 mt-1">{{ task.title }}</p>
            </div>
            <a href="{{url_for('home') }}"
               class="text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-6 rounded transition-colors">
                ← Back to Tasks
            </a>
        </header>
        <form method="POST" class="flex flex-wrap gap-3 mb-8 bg-white p-4 rounded-lg shadow-sm border border-slate-200">
            <input type="text" id="title" name="title" value="{{ task.title }}" required
                   class="flex-1 min-w-[150px] bg-white border border-slate-300 rounded px-3 py-2 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <select id="priority" name="priority"
                    class="bg-white border border-slate-300 rounded px-3 py-2 text-slate-900">
                <option value="LOW" {% if task.priority == 0 %}selected{% endif %}>Low</option>
                <option value="MEDIUM" {% if task.priority == 1 %}selected{% endif %}>Medium</option>
                <option value="HIGH" {% if task.priority == 2 %}selected{% endif %}>High</option>
            </select>
            <input type="date" id="due_date" name="due_date" {% if task.due_date %}value="{{ task.due_date }}"{% endif %}
                   class="bg-white border border-slate-300 rounded px-3 py-2 text-slate-900">
            <button type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded transition-colors">
                Save Changes
            </button>
            <textarea name="description" rows="2"
                      class="bg-white border border-slate-300 rounded px-3 py-2 w-full text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500">{{ task.description or '' }}</textarea>
        </form>
        <footer class="mt-12 pt-6 border-t border-slate-200 text-center text-sm text-slate-500">
            <p>
                Made with Flask & Tailwind CSS ·
                <a href="https://github.com/maciek404/todo-list"
                   target="_blank" rel="noopener noreferrer"
                   class="text-blue-600 hover:text-blue-700 hover:underline">
                    View on GitHub
                </a>
            </p>
        </footer>
    </div>
</body>
</html>
