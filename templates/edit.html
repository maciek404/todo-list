<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Task</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen font-sans">
    <div class="max-w-2xl mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-6">📝 Edit Task</h1>
        <form method="POST" class="flex flex-wrap gap-3 mb-8 bg-white p-4 rounded-lg shadow-sm border border-slate-200">
            <input type="text" id="title" name="title" value="{{ task.title }}" required
                   class="flex-1 min-w-[150px] bg-white border border-slate-300 rounded px-3 py-2 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <select id="priority" name="priority"
                    class="bg-white border border-slate-300 rounded px-3 py-2 text-slate-900">
                <option value="LOW" {% if task.priority == 0 %}selected{% endif %}>Low</option>
                <option value="MEDIUM" {% if task.priority == 1 %}selected{% endif %}>Medium</option>
                <option value="HIGH" {% if task.priority == 2 %}selected{% endif %}>High</option>
            </select>
            <input type="date" id="due_date" name="due_date" {% if task.due_date %}value="{{ task.due_date }}"{% endif %}
                   class="bg-white border border-slate-300 rounded px-3 py-2 text-slate-900">
            <button type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded transition-colors">
                Save Changes
            </button>
        </form>
    </div>
</body>
</html>
